[package]
name = "daiorama-dashboard"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "daiorama-dashboard"
path = "src/main.rs"

[dependencies]
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }

[dev-dependencies]
tempfile = "=3.27.0"
